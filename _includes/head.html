<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}{% unless page.layout == "home" %} · {{ site.name | escape }}{% endunless %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 | escape }}{% else %}{{ site.description | strip | escape }}{% endif %}">
  <meta name="author" content="{{ site.name }}">
  <meta name="theme-color" content="#faf9f6">
  <link rel="icon" href="{{ site.baseurl }}/assets/icons/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="{{ site.baseurl }}/assets/icons/apple-icon-180x180.png">
  <link rel="stylesheet" href="{{ site.baseurl }}/css/personal.css">
  <link rel="canonical" href="{{ page.canonical_url | default: page.url | replace: 'index.html', '' | prepend: site.baseurl | prepend: site.url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ site.baseurl }}/feed.xml">
  {% if page.layout == "post" %}
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/8.5/styles/{{ site.highlightjs_theme }}.min.css">
  {% endif %}
</head>
